name: Sincronizar web ICAI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '18 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: icai-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Validar Excel y generar web
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Comprobar la plantilla incluida
        run: python scripts/build_site.py --output "$RUNNER_TEMP/icai-check"
      - name: Obtener acceso de lectura a Google Drive
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request' && (vars.ICAI_DRIVE_FILE_ID != '' || vars.ICAI_DRIVE_FOLDER_ID != '')
        id: drive
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.ICAI_GCP_IDENTITY_PROVIDER }}
          service_account: ${{ vars.ICAI_GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/drive.readonly
          create_credentials_file: false
          export_environment_variables: false
      - name: Generar con las fuentes configuradas
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        env:
          ICAI_DRIVE_FILE_ID: ${{ vars.ICAI_DRIVE_FILE_ID }}
          ICAI_DRIVE_FOLDER_ID: ${{ vars.ICAI_DRIVE_FOLDER_ID }}
          ICAI_DRIVE_TOKEN: ${{ steps.drive.outputs.access_token }}
          ICAI_UMA_PUBLIC_SYNC: ${{ vars.ICAI_UMA_PUBLIC_SYNC }}
        run: python scripts/build_site.py
      - name: Guardar previsualización
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: preview-icai
          path: ${{ runner.temp }}/icai-check
      - name: Preparar sitio para Pages
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Publicar en GitHub Pages
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
